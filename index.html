<script>
// FIX 1: Timer Red + Shake + Urgent Sound at 3 seconds
(function(){
  const origShowQuestion = window.showQuestion;
  window.showQuestion = function(){
    if(origShowQuestion) origShowQuestion.apply(this, arguments);
    // Reset timer color
    const timerEl = document.getElementById('timer');
    if(timerEl) timerEl.classList.remove('danger');
  };
})();

// Override timer interval to add danger effect
const origSetInterval = window.setInterval;
window.setInterval = function(fn, delay){
  if(delay === 1000){
    const wrappedFn = function(){
      fn();
      const timerEl = document.getElementById('timer');
      if(timerEl){
        const time = parseInt(timerEl.textContent);
        if(time <= 3 && time > 0){
          timerEl.classList.add('danger');
          // Urgent sound - fast beeps
          try{
            if(window.playTone){
              window.playTone(700, 0.08, 'sine', 0.18);
              setTimeout(()=>window.playTone(600, 0.06, 'sine', 0.15);
            }
          }catch(e){}
        } else {
          timerEl.classList.remove('danger');
        }
      }
    };
    return origSetInterval(wrappedFn, delay);
  }
  return origSetInterval(fn, delay);
};

// Fix Urdu title beautiful
const origApplyLanguage = window.applyLanguage;
window.applyLanguage = function(lang){
  if(origApplyLanguage) origApplyLanguage(lang);
  try{
    const hTitle = document.getElementById('homeTitle');
    if(lang === 'ur' && hTitle){
      hTitle.innerHTML = '<span class="urdu-title" style="font-family:Noto Nastaliq Urdu, serif">کلک اسلامک کوئزگیم</span>';
      hTitle.style.background = 'none';
      hTitle.style.webkitTextFillColor = 'unset';
    }
  }catch(e){ console.log(e); }
};

// Sound functions for timer
window.playTick = function(){
  if(!window.soundOn) return;
  try{ window.playTone(700, 0.05, 'sine', 0.10); }catch(e){}
};
window.playUrgent = function(){
  if(!window.soundOn) return;
  try{
    window.playTone(700, 0.08, 'sine', 0.18);
    setTimeout(()=>window.playTone(600, 0.06, 'sine', 0.15);
  }catch(e){}
};
</script>
